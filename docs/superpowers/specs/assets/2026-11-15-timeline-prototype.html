<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>[시제품] 순위 타임라인</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-0: #eef0f3;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #8a8984;
    --grid: #e6e5e0;
    --axis: #9b9a95;
    --ac: #1f9d3a;
    --rej: #d63a36;
    --freeze: rgba(120, 140, 180, 0.10);
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
    --series-4: #eda100; --series-5: #e87ba4; --series-6: #6250d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: var(--surface-0); color: var(--text-primary); }
  .proto-banner { background: #fff3b0; padding: 6px 16px; font-size: 13px; border-bottom: 1px solid #e6d784; }
  /* mock of the time-machine header */
  .hdr { height: 42px; background: #1f2430; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 14px; font-size: 15px; }
  .hdr b { font-weight: 700; }
  .hdr .final { background: #f5c400; color: #1f2430; font-size: 10px; font-weight: 800; border-radius: 9px; padding: 1px 7px; }
  .hdr .spacer { flex: 1; }
  .hdr input[type=range] { width: 260px; accent-color: #f5c400; }
  .hdr .time { font-variant-numeric: tabular-nums; min-width: 46px; }
  .hdr button { background: #2f3646; color: #fff; border: 1px solid #4a5368; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .hdr button.on { background: #f5c400; color: #1f2430; border-color: #f5c400; font-weight: 700; }

  .wrap { display: grid; grid-template-columns: 300px 1fr; gap: 12px; padding: 12px; height: calc(100vh - 42px - 31px - 20px); }
  .card { background: var(--surface-1); border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .picker { display: flex; flex-direction: column; min-height: 0; }
  .picker h2, .chart-card h2 { font-size: 15px; margin: 12px 14px 8px; }
  .picker .hint { font-size: 12px; color: var(--text-secondary); margin: 0 14px 8px; }
  .picker input[type=search] { margin: 0 14px 8px; padding: 6px 9px; border: 1px solid #c9c8c2; border-radius: 6px; font-size: 13px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 14px 8px; min-height: 26px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid #d8d7d2; border-radius: 13px; padding: 2px 4px 2px 8px; background: #fff; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .chip button { border: 0; background: none; cursor: pointer; color: var(--text-muted); font-size: 14px; line-height: 1; }
  .list { overflow-y: auto; flex: 1; border-top: 1px solid var(--grid); }
  .row { display: grid; grid-template-columns: 22px 34px 1fr; align-items: center; padding: 5px 14px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f3f2ee; }
  .row:hover { background: #f4f7ff; }
  .row .rk { color: var(--text-secondary); font-variant-numeric: tabular-nums; text-align: right; padding-right: 8px; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .sc { display: block; font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.disabled { opacity: .45; cursor: not-allowed; }
  .presets { display: flex; gap: 6px; margin: 0 14px 10px; flex-wrap: wrap; }
  .presets button { font-size: 12px; padding: 3px 8px; border: 1px solid #c9c8c2; background: #fff; border-radius: 6px; cursor: pointer; }

  .chart-card { display: flex; flex-direction: column; min-height: 0; position: relative; }
  .ctrl { display: flex; gap: 16px; align-items: center; margin: 0 14px 6px; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid #c9c8c2; border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--text-secondary); }
  .seg button.on { background: #1f2430; color: #fff; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 14px 4px; font-size: 12px; color: var(--text-secondary); align-items: center; }
  .legend .sw { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 5px; }
  .legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
  .legend .ring { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid #555; vertical-align: middle; margin-right: 5px; background: #fff; }
  svg { display: block; flex: 1; min-height: 0; width: 100%; }
  .foot { font-size: 11px; color: var(--text-muted); margin: 2px 14px 10px; }
  .tip { position: absolute; pointer-events: none; background: #fff; border: 1px solid #d8d7d2; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.14); padding: 8px 10px; font-size: 12px; min-width: 170px; display: none; z-index: 5; }
  .tip h4 { margin: 0 0 4px; font-size: 12px; color: var(--text-secondary); font-weight: 600; }
  .tip .tl { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; margin: 2px 0; }
  .tip .tl i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .tip .ev { color: var(--text-secondary); margin: 1px 0 1px 16px; }
  .empty { position: absolute; inset: 120px 0 auto 0; text-align: center; color: var(--text-muted); font-size: 14px; }
  text { font-family: inherit; }
  .vseg { display: inline-flex; border: 1px solid #4a5368; border-radius: 7px; overflow: hidden; }
  .vseg button { background: #2f3646; color: #cfd5e2; border: 0; padding: 5px 14px; font-size: 13px; cursor: pointer; }
  .vseg button.on { background: #f5c400; color: #1f2430; font-weight: 700; }
  .board { height: calc(100vh - 42px - 31px - 20px); overflow: hidden; }
  #bframe { border: 0; width: 100%; height: 100%; display: block; }
  .board .bhint { font-size: 12px; color: var(--text-secondary); margin: 0 4px 8px; }
  .brow { display: grid; grid-template-columns: 26px 54px 1fr 70px 90px; align-items: center; height: 44px; background: #fff; border-bottom: 1px solid #f1f1f1; cursor: pointer; padding: 0 10px; font-size: 15px; }
  .brow:hover { background: #e2f08b; }
  .brow .bk { font-size: 20px; font-variant-numeric: tabular-nums; text-align: right; padding-right: 14px; }
  .brow .bn small { display: block; font-size: 11px; color: #777; }
  .brow .bs { font-size: 20px; font-weight: 700; text-align: center; }
  .brow .bp { text-align: right; font-variant-numeric: tabular-nums; color: #333; }
  .brow .sel { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid #c9c8c2; }
  .brow.on { box-shadow: inset 4px 0 0 var(--c); background: #f6f8ff; }
  .brow.on .sel { border: 0; background: var(--c); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f2430; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; }
  .urlbar { font: 11px ui-monospace, monospace; color: #555; background: #f3f2ee; padding: 3px 16px; border-bottom: 1px solid #e3e2dc; }
</style>
</head>
<body class="viz-root">
<div class="proto-banner"><b>시제품</b> · 로컬 전용 · 2026 Seoul Regional unfrozen runs feed (1052 runs)로 계산합니다. 디자인 확인용이며 app 코드가 아닙니다.</div>
<div class="hdr">
  <b>Asia Seoul Regional Onsite Contest</b><span class="final">FINAL</span>
  <span class="spacer"></span>
  <span class="vseg" id="vseg"><button data-v="board">순위표</button><button data-v="timeline" id="tlTab">타임라인</button></span>
  <input id="slider" type="range" min="0" max="300" value="300">
  <span class="time" id="timeText">05:00</span>
</div>
<div class="urlbar" id="urlbar"></div>
<div class="board" id="board">
  <iframe id="bframe" title="time-machine board"></iframe>
</div>
<div class="toast" id="toast"></div>
<div class="wrap" id="tlwrap">
  <section class="card picker">
    <h2>팀 선택</h2>
    <p class="hint">최대 6팀까지 겹쳐 볼 수 있습니다. 순위표 화면에서 팀 행을 눌러도 추가됩니다.</p>
    <input type="search" id="q" placeholder="팀 / 학교 검색">
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </section>
  <section class="card chart-card">
    <h2 id="chartTitle">순위 타임라인</h2>
    <div class="ctrl">
      <span>세로축 <span class="seg" id="ySeg"><button data-v="all" class="on">전체 1–81위</button><button data-v="fit">선택 팀 범위</button></span></span>
    </div>
    <div class="legend" id="legend"></div>
    <svg id="svg"></svg>
    <div class="foot" id="foot">* 무벌점(컴파일 에러) · ×N: 같은 분에 N번 제출 · 회색 영역: 프리즈 (210분 이후)</div>
    <div class="tip" id="tip"></div>
    <div class="empty" id="empty">왼쪽에서 팀을 고르십시오.</div>
  </section>
</div>
<script>
const DUR = 300, FREEZE = 210, MAX_TEAMS = 6, PEN = 20;
const SERIES = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6'];
const css = (v) => getComputedStyle(document.body).getPropertyValue(v).trim();
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';

let contest, teams, teamById, finalRank, series = {}, events = {};
let selected = [];           // [{id, slot}] slot = fixed color slot, never re-painted
let yMode = 'all', fMode = 'full', now = DUR, view = 'board', solvedS = {}, penS = {};

function computeAll(runs) {
  const ids = teams.map((t) => t.id);
  const st = {};
  for (const id of ids) st[id] = { solved: 0, penalty: 0, last: 0, cells: {} };
  for (const id of ids) series[id] = new Array(DUR + 1);
  for (const id of ids) { events[id] = []; solvedS[id] = new Array(DUR + 1); penS[id] = new Array(DUR + 1); }
  const sorted = [...runs].sort((a, b) => a.submissionTime - b.submissionTime || a.id - b.id);
  let i = 0;
  for (let t = 0; t <= DUR; t++) {
    const before = {};
    for (; i < sorted.length && sorted[i].submissionTime <= t; i++) {
      const r = sorted[i];
      const s = st[r.team];
      if (!s) continue;
      const c = (s.cells[r.problem] ??= { ok: false, fails: 0 });
      const kind = r.result === 'Yes' ? 'ac' : r.result === 'No (no penalty)' ? 'ce' : 'no';
      events[r.team].push({ t, p: r.problem, kind, after: c.ok, id: r.id });
      if (c.ok) continue;
      if (kind === 'ac') {
        c.ok = true; s.solved += 1; s.penalty += t + PEN * c.fails; s.last = Math.max(s.last, t);
      } else if (kind === 'no') c.fails += 1;
    }
    // competition ranking: solved desc, penalty asc, last solve asc
    const keyed = ids.map((id) => [id, st[id]]);
    for (const [id, s] of keyed) {
      let better = 0;
      for (const [, u] of keyed) {
        if (u.solved > s.solved || (u.solved === s.solved && (u.penalty < s.penalty || (u.penalty === s.penalty && u.last < s.last)))) better++;
      }
      series[id][t] = 1 + better;
      solvedS[id][t] = s.solved; penS[id][t] = s.penalty;
    }
  }
  finalRank = Object.fromEntries(ids.map((id) => [id, series[id][DUR]]));
  return st;
}

// group same (minute, problem, kind) into one event with a count
function grouped(id, upto) {
  const out = [];
  for (const e of events[id]) {
    if (e.t > upto) continue;
    const last = out[out.length - 1];
    if (last && last.t === e.t && last.p === e.p && last.kind === e.kind) last.n++;
    else out.push({ ...e, n: 1 });
  }
  return out;
}
const label = (e) => e.p + (e.kind === 'ce' ? '*' : '') + (e.n > 1 ? ' ×' + e.n : '');
const kindText = { ac: '정답', no: '오답', ce: '컴파일 에러 (무벌점)' };

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

function draw() {
  const svg = $('svg');
  svg.innerHTML = '';
  $('empty').style.display = selected.length ? 'none' : 'block';
  const W = svg.clientWidth, H = svg.clientHeight;
  const m = { l: 52, r: selected.length > 1 ? 150 : 24, t: 14, b: 36 };
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const N = teams.length;
  let y0 = 1, y1 = N;
  if (yMode === 'fit' && selected.length) {
    const upto = DUR;
    let lo = Infinity, hi = -Infinity;
    for (const { id } of selected) for (let t = 0; t <= upto; t++) { lo = Math.min(lo, series[id][t]); hi = Math.max(hi, series[id][t]); }
    y0 = Math.max(1, lo - 2); y1 = Math.min(N, hi + 2);
    if (y1 - y0 < 6) { y1 = Math.min(N, y0 + 6); }
  }
  const X = (t) => m.l + (t / DUR) * pw;
  const Y = (r) => m.t + ((r - y0) / Math.max(1, y1 - y0)) * ph;

  const g = el('g', {}, svg);
  // freeze band
  el('rect', { x: X(FREEZE), y: m.t, width: X(DUR) - X(FREEZE), height: ph, fill: css('--freeze') }, g);
  el('text', { x: X(FREEZE) + 6, y: m.t + ph - 6, 'font-size': 11, fill: css('--text-muted') }, g).textContent = '프리즈';
  // grid + axes
  const yTicks = niceTicks(y0, y1);
  for (const r of yTicks) {
    el('line', { x1: m.l, x2: m.l + pw, y1: Y(r), y2: Y(r), stroke: css('--grid') }, g);
    el('text', { x: m.l - 8, y: Y(r) + 4, 'font-size': 11, 'text-anchor': 'end', fill: css('--text-secondary') }, g).textContent = r;
  }
  for (let t = 0; t <= DUR; t += 30) {
    el('line', { x1: X(t), x2: X(t), y1: m.t + ph, y2: m.t + ph + 4, stroke: css('--axis') }, g);
    const hh = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    el('text', { x: X(t), y: m.t + ph + 18, 'font-size': 11, 'text-anchor': 'middle', fill: css('--text-secondary') }, g).textContent = hh;
  }
  el('line', { x1: m.l, x2: m.l + pw, y1: m.t + ph, y2: m.t + ph, stroke: css('--axis') }, g);
  el('text', { x: 14, y: m.t + ph / 2, 'font-size': 11, fill: css('--text-secondary'), transform: `rotate(-90 14 ${m.t + ph / 2})`, 'text-anchor': 'middle' }, g).textContent = '순위';
  // current time marker
  if (now < DUR) {
    el('line', { x1: X(now), x2: X(now), y1: m.t, y2: m.t + ph, stroke: '#1f2430', 'stroke-dasharray': '4 3' }, g);
    el('text', { x: X(now) - 4, y: m.t + ph - 6, 'font-size': 11, 'text-anchor': 'end', fill: css('--text-primary') }, g).textContent = '현재 ' + $('timeText').textContent;
  }
  const clip = el('clipPath', { id: 'plot' }, el('defs', {}, svg));
  el('rect', { x: m.l, y: m.t - 6, width: pw + 8, height: ph + 12 }, clip);

  const single = selected.length === 1;
  const phases = [['solid', 0, DUR]];

  if (single) {
    const id = selected[0].id;
    // submission lines (as in the reference image)
    for (const [ph_, from, to] of phases) {
      const evs = grouped(id, to).filter((e) => e.t >= from);
      const op = ph_ === 'ghost' ? 0.22 : 1;
      const rowsLastX = [];
      for (const e of evs) {
        const col = e.kind === 'ac' ? css('--ac') : css('--rej');
        el('line', { x1: X(e.t), x2: X(e.t), y1: m.t, y2: m.t + ph, stroke: col, 'stroke-width': 1, opacity: 0.55 * op }, g);
        let row = 0;
        while (rowsLastX[row] !== undefined && X(e.t) - rowsLastX[row] < 13) row++;
        rowsLastX[row] = X(e.t);
        const ty = m.t + 6 + row * 40;
        const tx = el('text', { x: X(e.t) + 4, y: ty, 'font-size': 11, 'font-weight': 600, fill: col, opacity: op,
          transform: `rotate(-90 ${X(e.t) + 4} ${ty})`, 'text-anchor': 'end', stroke: css('--surface-1'), 'stroke-width': 3, 'paint-order': 'stroke' }, g);
        tx.textContent = label(e);
      }
    }
  }
  // rank lines
  for (const { id, slot } of selected) {
    const col = single ? css('--text-primary') : css(SERIES[slot]);
    for (const [ph_, from, to] of phases) {
      let d = 'M' + X(from).toFixed(1) + ',' + Y(series[id][from]).toFixed(1);
      for (let t = from; t < to; t++) {
        d += 'H' + X(t + 1).toFixed(1);
        if (series[id][t + 1] !== series[id][t]) d += 'V' + Y(series[id][t + 1]).toFixed(1);
      }
      el('path', { d, fill: 'none', stroke: col, 'stroke-width': single ? 2 : 2.25, opacity: ph_ === 'ghost' ? 0.25 : 1, 'clip-path': 'url(#plot)', 'stroke-linejoin': 'round' }, g);
    }
    if (!single) {
      // markers on the team's own line: filled = AC (with letter), ring = rejected
      for (const [ph_, from, to] of phases) {
        const op = ph_ === 'ghost' ? 0.25 : 1;
        for (const e of grouped(id, to).filter((e) => e.t >= from && !e.after)) {
          const cx = X(e.t), cy = Y(series[id][e.t]);
          if (e.kind === 'ac') {
            el('circle', { cx, cy, r: 5, fill: col, stroke: css('--surface-1'), 'stroke-width': 2, opacity: op }, g);
            el('text', { x: cx, y: cy - 9, 'font-size': 10, 'font-weight': 700, 'text-anchor': 'middle', fill: css('--text-primary'), opacity: op,
              stroke: css('--surface-1'), 'stroke-width': 3, 'paint-order': 'stroke' }, g).textContent = e.p;
          } else {
            el('circle', { cx, cy, r: 3.2, fill: css('--surface-1'), stroke: col, 'stroke-width': 1.5, opacity: op }, g);
          }
        }
      }
    }
  }
  // direct labels at the line ends (multi only), nudged apart
  if (!single && selected.length) {
    const ends = selected.map(({ id, slot }) => ({ id, slot, y: Y(series[id][DUR]) })).sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) ends[k].y = Math.max(ends[k].y, ends[k - 1].y + 15);
    for (const e of ends) {
      el('circle', { cx: X(DUR) + 10, cy: e.y - 4, r: 4, fill: css(SERIES[e.slot]) }, g);
      el('text', { x: X(DUR) + 18, y: e.y, 'font-size': 12, fill: css('--text-primary') }, g).textContent =
        `${series[e.id][DUR]}위 ${teamById[e.id].name}`.slice(0, 20);
    }
  }
  // hover layer
  const cross = el('line', { y1: m.t, y2: m.t + ph, stroke: '#555', 'stroke-width': 1, opacity: 0 }, svg);
  const hit = el('rect', { x: m.l, y: m.t, width: pw, height: ph, fill: 'transparent' }, svg);
  hit.addEventListener('mousemove', (ev) => {
    const box = svg.getBoundingClientRect();
    const t = Math.max(0, Math.min(DUR, Math.round(((ev.clientX - box.left - m.l) / pw) * DUR)));
    cross.setAttribute('x1', X(t)); cross.setAttribute('x2', X(t)); cross.setAttribute('opacity', 0.5);
    const tip = $('tip');
    const hh = String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
    let html = `<h4>${hh} (${t}분)</h4>`;
    for (const { id, slot } of selected) {
      const col = single ? css('--text-primary') : css(SERIES[slot]);
      html += `<div class="tl"><i style="background:${col}"></i><span>${teamById[id].name}</span><b>${series[id][t]}위</b></div>`;
      for (const e of grouped(id, t).filter((e) => e.t === t)) {
        const prev = series[id][Math.max(0, t - 1)];
        html += `<div class="ev">${e.p} ${kindText[e.kind]}${e.n > 1 ? ' ×' + e.n : ''}${e.kind === 'ac' && !e.after ? ` · ${prev}위 → ${series[id][t]}위` : ''}</div>`;
      }
    }
    tip.innerHTML = html;
    tip.style.display = 'block';
    const card = svg.parentElement.getBoundingClientRect();
    let lx = ev.clientX - card.left + 14;
    if (lx + 220 > card.width) lx = ev.clientX - card.left - 230;
    tip.style.left = lx + 'px';
    tip.style.top = (ev.clientY - card.top + 10) + 'px';
  });
  hit.addEventListener('mouseleave', () => { $('tip').style.display = 'none'; cross.setAttribute('opacity', 0); });

  // title + legend
  $('chartTitle').textContent = single ? `${teamById[selected[0].id].name} · 순위 타임라인` : '순위 타임라인';
  const lg = $('legend');
  if (single) lg.innerHTML = `<span><span class="sw" style="border-color:${css('--text-primary')}"></span>순위</span>` +
    `<span><span class="sw" style="border-color:${css('--ac')}"></span>정답 제출</span><span><span class="sw" style="border-color:${css('--rej')}"></span>오답 제출</span>`;
  else if (selected.length) lg.innerHTML = selected.map(({ id, slot }) => `<span><span class="sw" style="border-color:${css(SERIES[slot])}"></span>${teamById[id].name}</span>`).join('') +
    `<span><span class="dot" style="background:#555"></span>정답 (문제 글자)</span><span><span class="ring"></span>오답</span>`;
  else lg.innerHTML = '';
}

function niceTicks(a, b) {
  const span = b - a, step = span > 40 ? 10 : span > 16 ? 5 : span > 8 ? 2 : 1;
  const out = [a];
  for (let v = Math.ceil((a + 1) / step) * step; v < b; v += step) if (v - out[out.length - 1] >= step / 2) out.push(v);
  if (b - out[out.length - 1] >= step / 2) out.push(b); else out[out.length - 1] = b;
  return out;
}

function freeSlot() { const used = new Set(selected.map((s) => s.slot)); for (let s = 0; s < MAX_TEAMS; s++) if (!used.has(s)) return s; return -1; }
function toggle(id) {
  const k = selected.findIndex((s) => s.id === id);
  if (k >= 0) selected.splice(k, 1);
  else if (selected.length < MAX_TEAMS) selected.push({ id, slot: freeSlot() });
  render();
}
let boardSrc = null;
function boardUrl() { return 'board/index.html' + (now < DUR ? '?time=' + now : ''); }
function renderBoard() {
  const f = $('bframe');
  if (boardSrc !== boardUrl()) { boardSrc = boardUrl(); f.src = boardSrc; return; }
  paintBoardSelection();
}
function paintBoardSelection() {
  const doc = $('bframe').contentDocument;
  if (!doc || !doc.head) return;
  let st = doc.getElementById('proto-style');
  if (!st) {
    st = doc.createElement('style'); st.id = 'proto-style'; doc.head.appendChild(st);
    doc.addEventListener('click', (ev) => {
      const row = ev.target.closest && ev.target.closest('.team-row');
      if (!row) return;
      const id = row.getAttribute('data-team-id');
      if (!selected.some((x) => x.id === id) && selected.length >= MAX_TEAMS) { toast('타임라인에는 최대 6팀까지 넣을 수 있습니다.'); return; }
      toggle(id);
    });
  }
  const base = `.kr-header { display: none !important; } .app-main { padding-top: 0.75rem !important; } .team-row { cursor: pointer; }`;
  const sel = selected.map(({ id, slot }) => {
    const c = selected.length === 1 ? css('--text-primary') : css(SERIES[slot]);
    const c2 = css(SERIES[slot]);
    const [r, g2, b] = [1, 3, 5].map((k) => parseInt(c2.slice(k, k + 2), 16));
    return `.team-row[data-team-id="${id}"], .team-row[data-team-id="${id}"]:hover { background-color: rgba(${r}, ${g2}, ${b}, 0.22) !important; }`;
  }).join('\n');
  st.textContent = base + '\n' + sel;
}
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), 1800); }
function syncUrl() {
  const u = new URL(location.href);
  for (const k of ['p']) u.searchParams.delete(k);
  if (now < DUR) u.searchParams.set('time', now); else u.searchParams.delete('time');
  if (view === 'timeline') u.searchParams.set('view', 'timeline'); else u.searchParams.delete('view');
  if (selected.length) u.searchParams.set('teams', selected.map((s) => s.id).join(',')); else u.searchParams.delete('teams');
  history.replaceState(null, '', u);
  $('urlbar').textContent = 'URL: ' + u.pathname.split('/').pop() + u.search;
}
function render() {
  for (const b of $('vseg').querySelectorAll('button')) b.classList.toggle('on', b.dataset.v === view);
  $('tlTab').textContent = selected.length ? `타임라인 (${selected.length})` : '타임라인';
  $('board').style.display = view === 'board' ? 'block' : 'none';
  $('tlwrap').style.display = view === 'timeline' ? 'grid' : 'none';
  syncUrl();
  if (view === 'board') { renderBoard(); return; }
  const q = $('q').value.trim().toLowerCase();
  const list = $('list');
  const sorted = [...teams].sort((a, b) => series[a.id][now] - series[b.id][now] || Number(a.id) - Number(b.id));
  list.innerHTML = '';
  for (const t of sorted) {
    if (q && !(t.name.toLowerCase().includes(q) || (t.group || '').toLowerCase().includes(q))) continue;
    const on = selected.some((s) => s.id === t.id);
    const row = document.createElement('label');
    row.className = 'row' + (!on && selected.length >= MAX_TEAMS ? ' disabled' : '');
    row.innerHTML = `<input type="checkbox" ${on ? 'checked' : ''}><span class="rk">${series[t.id][now]}</span><span class="nm">${t.name}<span class="sc">${t.group || ''}</span></span>`;
    row.querySelector('input').addEventListener('change', () => toggle(t.id));
    list.appendChild(row);
  }
  const chips = $('chips');
  chips.innerHTML = '';
  for (const { id, slot } of selected) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.innerHTML = `<i style="background:${css(SERIES[slot])}"></i>${teamById[id].name}<button title="빼기">×</button>`;
    c.querySelector('button').onclick = () => toggle(id);
    chips.appendChild(c);
  }
  draw();
}

function seg(id, set) {
  for (const b of $(id).querySelectorAll('button')) b.onclick = () => {
    for (const x of $(id).querySelectorAll('button')) x.classList.toggle('on', x === b);
    set(b.dataset.v); render();
  };
}

(async () => {
  contest = await (await fetch('feed/contest.json')).json();
  const runs = (await (await fetch('feed/runs.json')).json()).runs;
  teams = contest.teams;
  teamById = Object.fromEntries(teams.map((t) => [t.id, t]));
  computeAll(runs);
  const byName = (n) => teams.find((t) => t.name === n).id;
  const presets = {
    1: ['floorsum'],
    2: ['floorsum', 'Phantasm', 'TrickcalCrabQuomo', 'Reboot Ssal Game'],
    3: ['Reboot Ssal Game', 'JourneytoTBA', '1 MiB'],
  };
  for (const b of document.querySelectorAll('.presets button')) b.onclick = () => {
    selected = presets[b.dataset.p].map((n, i) => ({ id: byName(n), slot: i }));
    render();
  };
  seg('ySeg', (v) => (yMode = v));
  $('q').oninput = render;
  for (const b of $('vseg').querySelectorAll('button')) b.onclick = () => { view = b.dataset.v; render(); };
  $('bframe').addEventListener('load', () => { setTimeout(paintBoardSelection, 50); });
  $('slider').oninput = (e) => {
    now = Number(e.target.value);
    $('timeText').textContent = String(Math.floor(now / 60)).padStart(2, '0') + ':' + String(now % 60).padStart(2, '0');
    if (view === 'timeline') render();
  };
  // The real slider reloads the page on release; the board follows on 'change'.
  $('slider').onchange = () => render();
  window.onresize = draw;
  const qp = new URLSearchParams(location.search);
  if (qp.get('teams')) selected = qp.get('teams').split(',').filter((id) => teamById[id]).slice(0, MAX_TEAMS).map((id, i) => ({ id, slot: i }));
  else if (qp.get('p')) selected = presets[qp.get('p')].map((n, i) => ({ id: byName(n), slot: i }));
  view = qp.get('view') === 'timeline' ? 'timeline' : 'board';
  const tq = qp.get('time') ?? qp.get('now');
  if (tq !== null) qp.set('now', tq);
  if (qp.get('y')) { yMode = qp.get('y'); for (const x of $('ySeg').querySelectorAll('button')) x.classList.toggle('on', x.dataset.v === yMode); }
  if (qp.get('now')) { now = Number(qp.get('now')); $('slider').value = now; $('timeText').textContent = String(Math.floor(now / 60)).padStart(2, '0') + ':' + String(now % 60).padStart(2, '0'); }
  render();
  const pre = document.createElement('pre'); pre.id = 'check'; pre.hidden = true;
  pre.textContent = JSON.stringify(Object.fromEntries(teams.map((t) => [t.name, finalRank[t.id]])));
  document.body.appendChild(pre);
})();
</script>
